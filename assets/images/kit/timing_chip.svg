<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="chip-title">
  <title id="chip-title">Dark timing chip on an orange ankle strap</title>
  <!-- strap -->
  <polygon points="6,98 234,98 234,142 6,142" fill="#E8642A"/>
  <polygon points="6,98 234,98 234,108 6,108" fill="#F5A623"/>
  <polygon points="6,134 234,134 234,142 6,142" fill="#D2491A"/>
  <path d="M6 120 H66 M174 120 H234" stroke="#FFFBF7" stroke-width="2" stroke-dasharray="7 6" opacity="0.8"/>
  <!-- strap end tab with slot -->
  <rect x="6" y="98" width="22" height="44" fill="#D2491A"/>
  <rect x="14" y="108" width="6" height="24" fill="#1E1B18"/>
  <!-- chip -->
  <rect x="66" y="52" width="108" height="136" fill="#1E1B18"/>
  <rect x="66" y="52" width="108" height="10" fill="#5A534D"/>
  <rect x="66" y="52" width="10" height="136" fill="#2E2924"/>
  <!-- antenna coil -->
  <rect x="86" y="72" width="68" height="68" fill="none" stroke="#5A534D" stroke-width="3"/>
  <rect x="94" y="80" width="52" height="52" fill="none" stroke="#5A534D" stroke-width="3"/>
  <rect x="102" y="88" width="36" height="36" fill="none" stroke="#5A534D" stroke-width="3"/>
  <!-- arrow mark -->
  <path d="M120 92 L102 114 H113 V130 H127 V114 H138 Z" fill="#E8642A"/>
  <!-- status light and id bars -->
  <rect x="86" y="156" width="14" height="14" fill="#FFD200"/>
  <rect x="110" y="156" width="44" height="6" fill="#FFFBF7"/>
  <rect x="110" y="166" width="30" height="4" fill="#FFFBF7" opacity="0.6"/>
</svg>
