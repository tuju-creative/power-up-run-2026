<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-labelledby="runner-title">
  <title id="runner-title">A runner in an orange shirt mid-stride, with motion lines behind</title>
  <style>
    .speed { animation: speed 1.6s ease-in-out infinite alternate; }
    .speed--2 { animation-delay: -0.5s; }
    .speed--3 { animation-delay: -1s; }
    @keyframes speed { from { transform: translateX(0); } to { transform: translateX(-14px); } }
    @media (prefers-reduced-motion: reduce) { .speed { animation: none; } }
  </style>

  <!-- backdrop: yellow block, offset ink frame, sun, ground -->
  <rect x="100" y="60" width="332" height="332" fill="#FFD200"/>
  <circle cx="376" cy="128" r="32" fill="#F5A623"/>
  <rect x="76" y="84" width="332" height="332" fill="none" stroke="#1E1B18" stroke-width="6"/>
  <rect x="40" y="392" width="400" height="12" fill="#1E1B18"/>
  <rect x="176" y="380" width="170" height="8" fill="#1E1B18" opacity="0.16"/>

  <!-- speed lines -->
  <g fill="#1E1B18">
    <rect class="speed" x="22" y="172" width="88" height="8"/>
    <rect class="speed speed--2" x="46" y="214" width="64" height="8"/>
    <rect class="speed speed--3" x="16" y="256" width="80" height="8"/>
  </g>

  <g transform="translate(-50 -26) scale(1.2)">
  <!-- far limbs (behind the torso): arm swinging forward, leg kicked up behind -->
  <g fill="none" stroke="#5A534D" stroke-width="16" stroke-linejoin="miter" stroke-linecap="butt">
    <polyline points="278,172 314,198 340,164"/>
    <polyline points="228,254 176,300 112,270"/>
  </g>
  <polygon points="122,262 102,254 80,290 100,302" fill="#D2491A"/>

  <!-- torso, leaning into the stride -->
  <polygon points="247,158 286,173 246,256 217,244" fill="#E8642A"/>
  <g transform="rotate(22 251 206)">
    <rect x="240" y="192" width="24" height="26" fill="#FFFBF7"/>
    <rect x="244" y="202" width="16" height="5" fill="#1E1B18"/>
  </g>

  <!-- neck and head -->
  <path d="M276 150 268 164" stroke="#1E1B18" stroke-width="14" fill="none"/>
  <circle cx="284" cy="128" r="24" fill="#1E1B18"/>
  <polygon points="260,120 306,110 309,123 261,133" fill="#FFD200"/>

  <!-- shorts -->
  <polygon points="214,238 252,250 262,282 212,276 204,258" fill="#D2491A"/>

  <!-- near limbs: leg driving the knee up, arm swinging back -->
  <g fill="none" stroke="#1E1B18" stroke-width="18" stroke-linejoin="miter" stroke-linecap="butt">
    <polyline points="236,256 300,240 286,308"/>
    <polyline points="258,168 214,188 196,228"/>
  </g>
  <polygon points="272,302 300,306 336,320 336,332 272,330" fill="#E8642A"/>
  </g>
</svg>
